services:
  # ============================================
  # Frontend (Next.js)
  # ============================================
  # DOCKER_IMAGE pode ser:
  # - Registry publico: ghcr.io/usuario/frontend:latest
  # - Imagem local importada no VPS: surb/frontend:production
  # Configure via variavel de ambiente DOCKER_IMAGE
  # ============================================
  frontend:
    image: ${DOCKER_IMAGE:-surb/frontend:production}
    networks:
      - network_public
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: https://surb.com.br
      NEXT_PUBLIC_API_URL: https://api.surb.com.br
      NEXT_PUBLIC_AUTH_URL: https://auth.surb.com.br
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
      labels:
        # Traefik - Roteamento HTTPS
        - traefik.enable=true
        - traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN:-surb.com.br}`)
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.frontend.priority=1
        - traefik.http.routers.frontend.service=frontend
        - traefik.http.services.frontend.loadbalancer.server.port=3000
        - traefik.http.services.frontend.loadbalancer.passHostHeader=true
        # Router HTTP -> Redirect para HTTPS
        - traefik.http.routers.frontend_http.rule=Host(`${APP_DOMAIN:-surb.com.br}`)
        - traefik.http.routers.frontend_http.entrypoints=web
        - traefik.http.routers.frontend_http.middlewares=frontend_redirect_https
        - traefik.http.middlewares.frontend_redirect_https.redirectscheme.scheme=https
        - traefik.http.middlewares.frontend_redirect_https.redirectscheme.permanent=true
        # Middlewares SSL Headers
        - traefik.http.middlewares.frontend_sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.frontend.middlewares=frontend_sslheader
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  network_public:
    external: true
    name: network_public
